<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>
        Update trek
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="header 	">
        <div style="background-color:#2d6a4f;padding-right:40px;" class="d-flex justify-content-between align-items-center p-1">
            <h4 class="ms-2">TrekManager</h4>
        <nav class="navbar navbar-expand-lg " >
        <div class="container-fluid">
            <ul class="navbar-nav flex-row gap-3 mx-auto">
                <li class="nav-item"><a class="nav-link " href="{{url_for('staff_dashboard')}}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="{{url_for('my_trek')}}">My Treks</a></li>
                <li class="nav-item"><a class="nav-link badge text-bg-warning mt-2">Staff</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </div></div>
    </nav>
        
        </div>
        <form method="POST" action="{{ url_for('update_trek', trek_id=trek.Trek_Id) }}">
        <div class="card ms-4 me-4 mt-4">
            <div class="card-header">
                <i class="bi bi-pencil"></i> Update Trek: {{trek.Trek_Name}}
            </div>
            <div class="card-body">
                <h5 class="card-title">Available Slots</h5>
                <input class="form-control" type="number" name="available_slots"  placeholder="Default input" aria-label="default input example" value="{{trek.Available_Slots}}">
                <h5 class="card-title mt-3">Trek Status</h5>
                <select name="status" class="form-select mb-3">
                    <option value="Open" {{ 'selected' if trek.Status == 'Open' else '' }}>Open</option>
                    <option value="Closed" {{ 'selected' if trek.Status == 'Closed' else '' }}>Closed</option>
                    <option value="Completed" {{ 'selected' if trek.Status == 'Completed' else '' }}>Completed</option>
                </select>
        <button type="submit" class="btn btn-success"><i class="bi bi-box-arrow-down"></i> Save Changes</button>
        <a href="{{ url_for('my_trek') }}" class="btn btn-secondary">Cancel</a>
            </div>
    </body>
</html>
