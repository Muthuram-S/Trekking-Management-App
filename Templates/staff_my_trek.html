<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        My Trek
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="header">
        <div style="background-color: #2d6a4f;padding-right:40px;"
            class="d-flex justify-content-between align-items-center p-1">
            My Trek
            <button type="button"
                style=" color: black  ;background-color: #d5b1b162;float: right;border: none;margin-right: 3%;"
                class="btn btn-secondary">Logout</button>
        </div>
    </div>
    
    <div class="container mt-4">
        {%for t in trek %}
        <div class="row ">
            
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title d-flex">{{ t.Trek_Name }} <span class="justify-content-end">---{{t.Difficulty}}</span>  </h5>
                        

                        <p class="text-muted mb-2"><i class="bi bi-geo-alt me-1"></i>{{ t.Location }}</p>
                        <p class="text-muted mb-2"><i class="bi bi-calendar me-1"></i>{{ t.Start_Date }} → {{ t.End_Date
                            }}</p>
                        <p class="text-muted mb-2"><i class="bi bi-clock"></i> {{ t.Duration }} <i
                                class="bi bi-people"></i>  {{ t.Available_Slots }}/{{ t.Total_Slots }}</p>
                        <!--<span class="badge badge-{{ t.Status.lower() }} mb-3">{{ t.Status }}</span>
                        !-->
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('update_trek', trek_id=t.Trek_Id) }}" class="btn btn-primary btn-sm"><i
                                    class="bi bi-pencil me-1"></i>Update</a>
                            <a href="{{ url_for('participants', trek_id=t.Trek_Id) }}"
                                class="btn btn-outline-secondary btn-sm"><i
                                    class="bi bi-people me-1"></i>Participants</a>
                        </div>
                       
                    </div>
                </div>
            </div>
        </div>
         {%endfor%}

</body>

</html>
