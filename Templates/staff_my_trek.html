<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <title>
            My Trek
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="header">
        <div style="background-color: #d5b1b162;padding-right:40px;" class="d-flex justify-content-between align-items-center p-1">
            My Trek
            <button type="button" style=" color: black  ;background-color: #d5b1b162;float: right;border: none;margin-right: 3%;" class="btn btn-secondary">Logout</button>
        </div>
    </div>
    <div class="card w-50">
        <div class="card-body">
            <h5 class="card-title">
                {%for t in trek %}
                </h5>
        <span class="badge badge-{{ t.difficulty.lower() }} difficulty-badge">{{ t.difficulty }}</span>
        <h4 class="fw-bold">{{t.name}}</h4>
        <p class="text-muted mb-2"><i class="bi bi-geo-alt me-1"></i>{{ t.location }}</p>
        <p class="text-muted mb-2"><i class="bi bi-calendar me-1"></i>{{ t.start_date }} → {{ t.end_date }}</p>
        <p class="text-muted mb-2"><i class="bi bi-clock"></i>{{ t.location }}<i class="bi bi-people"></i>{{t.people}}</p>
        <span class="badge badge-{{ t.status.lower() }} mb-3">{{ t.difficulty }}</span>
        <span class="badge badge-{{ t.status.lower() }} mb-3">{{ t.status }}</span>
        <div class="d-flex gap-2">
          <a href="{{ url_for('staff_update', id=t.id) }}" class="btn btn-primary btn-sm"><i class="bi bi-pencil me-1"></i>Update</a>
          <a href="{{ url_for('staff_participants', id=t.id) }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-people me-1"></i>Participants</a>
        </div>
        
            </div>
        </div>
    </div>

    </body>
</html>
