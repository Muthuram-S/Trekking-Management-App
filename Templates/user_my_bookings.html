<!DOCTYPE html>
<html >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <h1>My Bookings & Trekking History</h1>
    <div class="btn-toolbar mb-3" role="toolbar" aria-label="Toolbar with button groups">
  <div class="btn-group me-2" role="group" aria-label="First group">
    <button type="button" class="btn btn-outline-secondary">1</button>
    <button type="button" class="btn btn-outline-secondary">2</button>
    <button type="button" class="btn btn-outline-secondary">3</button>
    <button type="button" class="btn btn-outline-secondary">4</button>
  </div>
    </div>
    <table class="table table-hover mb-0">
      <thead><tr><th>ID</th><th>Trek</th><th>Location</th><th>Difficulty</th><th>Booked On</th><th>Staff</th><th>Trek Status</th><th>Booking Status</th><th>Action</th></tr></thead>
      <tbody>
        {% for t in recent_treks %}
        <tr>
            <td>#{{ t.Booking_Id }}</td>
            <td>{{t.trek.Trek_Name}}</td>
            <td>{{t.trek.Location}}</td>
            <td>{{t.trek.Diffculty}}</td>
            <td>{{t.Booking_Date}}</td>
            <td>{{t.trek.Status}}</td>
           
            <td>{{}}</td>
        </tr>
        {% endfor  %}
      </tbody>
        </table>
</body>
</html>
