<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta viewport="1.0" content="width=device-width,initial-scale=1.0">
    <title>
        Display Trek
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="header">
        <div style="background-color: #d5b1b162;padding-right:40px;" class="d-flex justify-content-between align-items-center p-1">
            Admin's Dashboard
            <button type="button" style=" color: black  ;background-color: #d5b1b162;float: right;border: none;margin-right: 3%;" class="btn btn-secondary">Logout</button>
        </div>
        
    </div>
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-map me-2"></i>Recent Treks</span>
            <a href="#" class="btn btn-light btn-sm">View All</a>
        </div>
        <table class="table table-hover mb-0">
      <thead><tr><th>ID</th><th>Name</th><th>Location</th><th>Difficulty</th><th>Slots</th><th>Status</th></tr></thead>
      <tbody>
        {% for t in recent_treks %}
        <tr>
            <td>#{{ t.id }}</td>
            <td>{{t.name}}</td>
            <td>{{t.location}}</td>
            <td>{{t.diffculty}}</td>
            <td>{{t.status}}</td>
        
        </tr>
        {% endfor  %}
      </tbody>
        </table>
    </div>
    
    </body>
</html>
