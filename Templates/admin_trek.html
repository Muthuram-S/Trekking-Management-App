<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta viewport="1.0" content="width=device-width,initial-scale=1.0">
    <title>
        Display Trek
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <div>
        <div class="header 	--bs-success-bg-subtle">
        <div style="background-color:#2d6a4f;padding-right:40px;" class="d-flex justify-content-between align-items-center p-1">
            Admin's Dashboard
            
            <button type="button" style=" color: black  ;background-color: #d5b1b162;float: right;border: none;margin-right: 3%;" class="btn btn-secondary">Logout</button>
        </div>
        
    </div>
        
    </div>
        <div class="container">
        <div class=" row justify-content-center">
        <div class="col-14">
        
       
        <div class="card mt-3" style="border-color: white;">
        <div class="container">

        <div class="row justify-content-center">
            <h4 class="mt-4 "><i class="bi bi-map"></i> Treks</h4>
        <div class="col-14">
            
        <table class="table table-hover mb-0 ">
            
      <thead class="table-dark"><tr><th>ID</th><th>Name</th><th>Location</th><th>Difficulty</th><th>Slots</th><th>Status</th></tr></thead>
      <tbody>
        {% for t in recent_treks %}
        <tr>
            <td>#{{ t.id }}</td>
            <td>{{t.name}}</td>
            <td>{{t.location}}</td>
            <td>{{t.diffculty}}</td>
            <td>{{t.status}}</td>
        
        </tr>
        {% endfor  %}
      </tbody>
        </table>
    </div>
        </div>
        </div>
    </div>
        </div>
        </div>
        </div>
    </div>
    
    </body>
</html>
