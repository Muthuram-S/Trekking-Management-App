<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>
            Profile
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <body>
        <h2 class="mb-4">My Profile</h2>
        <div class="row justify-content-center">
            <div class="col-md-6 border border-0">
            <div class="card p-4">
            
        <form method="POST" action="{{ url_for('user.profile') }}">
      
        <div class="mb-3">
        <p>Full Name</p>
        <input class="form-control" type="text" value="{{ current_user.name }}" aria-label="Disabled input example"  >
        </div>
        <div class="mb-3">
        <p>E-mail</p>
        <input class="form-control" type="text" value="{{ current_user.name }}" aria-label="Disabled input example" disabled readonly>
        </div>
        <div class="mb-3">
        <p>contact</p>
        <input class="form-control" type="text" value="{{ current_user.name }}" aria-label="Disabled input example"  >
        </div>
        </div>
        </form>
        </div>
        </div>
    </div>
    </body>
</html>
