<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0"> 
    <title>
        Participants
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="container mt-4">
            <i class="bi bi-people-fill"></i><h5>Participants:{{trek.Trek_Name}}</h5>
        </div>
        <table class="table table-hover table-bordered">
            <thead class="table-dark"><tr><th>Booking ID</th><th>User Id</th><th>Name</th><th>Email</th><th>Booking Date</th><th>Status</th></tr></thead>
            <tbody>
                {%  for i in book %}
                <tr>
                <td>
                    {{i.Booking_Id}}
                </td>
                <td>
                    {{i.User_Id}}
                </td>
                <td>
                    {{i.user.Username}}
                </td>
                <td>
                    {{i.user.Email}}
                </td>
                <td>
                    {{i.Booking_Date}}
                </td>
                <td>
                    <span class="badge {{ 'bg-primary' if i.Status == 'Booked' else 'bg-danger' }}">
                        {{ i.Status }}
                    </span>
                </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </body>
</html>
