<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta viewport="1.0" content="width=device-width,initial-scale=1.0">
    <title>
        Display Trek
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="header 	--bs-success-bg-subtle">
        <div style="background-color:#2d6a4f;padding-right:40px;" class="d-flex justify-content-between align-items-center p-1">
            Admin's Dashboard
            <button type="button" style=" color: black  ;background-color: #d5b1b162;float: right;border: none;margin-right: 3%;" class="btn btn-secondary">Logout</button>
        </div>
        
    </div>
        
    </div>
    <div>
       
    </div>
    <br>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-14">
        <table class="table">
        <thead class="table-dark">
            <h4 class="mt-3 mb-2"> <i class="bi bi-people-fill"></i> User Management</h4>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Bookings</th>
            <th>Status</th>
           ]
        </thead>
        <tbody>
          
                {%for i in user%}
                    <td>#{{i.Id}}</td>
                    <td>{{i.Username}}</td>
                    <td>{{i.Email}}</td>
                    <td>{{booking_count}}</td>
                    <td>{% if i.Status=="Approved"%}
                        <a href="#" class="btn btn-danger btn-sm">Blacklist</a>
                        {%else%}
                        <a href="#" class="btn btn-success btn-sm">Approve</a>
                        {%endif%}
                    </td>
                   
            {%endfor%}
        </tbody>
        </table>
    </div>
</div>
</div>



</body>
</html>
