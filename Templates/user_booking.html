        </div>

        <div class="card w-50">
        <div class="card-body">
            <h5 class="card-title">
                {%for t in trek %}
                </h5>
        <span class="badge badge-{{ t.difficulty.lower() }} difficulty-badge">{{ t.difficulty }}</span>
        <h4 class="fw-bold">{{t.name}}</h4>
        <p class="text-muted mb-2"><i class="bi bi-geo-alt me-1"></i>{{ t.location }}</p>

        
        <span class="badge badge-{{ t.status.lower() }} mb-3">{{ t.status }}</span>
