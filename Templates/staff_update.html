<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>
        Update trek
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <body>
        <div class="card ">
            <div class="card-header">
                {%for i in trek%}
                <i class="bi bi-pencil"></i> Update Trek:{{i.name}}
            </div>
            <div class="card-body">
                <h5 class="card-title">Available Slots</h5>
                <input class="form-control" type="number" placeholder="Default input" aria-label="default input example">
                <h5 class="card-title">Trek Status</h5>
                <div class="input-group mb-3">
        <input type="text" class="form-control" aria-label="Text input with dropdown button">
        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Dropdown</button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">Easy</a></li>
            <li><a class="dropdown-item" href="#">Moderate</a></li>
            <li><a class="dropdown-item" href="#">Hard</a></li>
        </ul>
        </div>
        <button>Save Changes</button>
        <button>Cancel</button>
            </div>
    </body>
</html>
