{%extends "index.html"%}
{%block content%}
<h1 class="align-center" style="margin-top: 0;">Register</h1>

  <form method="POST">
    <div class="mb-1">
    <label class="form-label">Username</label>
  <input class="form-control" name="name" type="text" placeholder="Username" aria-label="default input example" required>
</div>
<div >
    <label  class="form-label">Email address</label>
  <input type="email" class="form-control"   pattern="[a-zA-Z0-9._%+-]+@gmail\.com" name="mail" id="exampleFormControlInput1" placeholder="name@example.com" required>
</div>
<div class="mb-1">
    <label for="inputPassword5" class="form-label">Password</label>
<input type="password" id="inputPassword5" name="password" class="form-control" minlength="6" aria-describedby="passwordHelpBlock" required>
</div>
<div class="mb-1">
    <label for="inputPassword5" class="form-label">Confirm Password</label>
<input type="password" id="inputPassword5"  name="confirm_password" class="form-control" minlength="6" aria-describedby="passwordHelpBlock" required>

</div>
<div class="mb-1">
          <label class="form-label fw-semibold">Register As</label>
          <select name="role" class="form-select" required>
            <option value="User">Trekker (User)</option>
            <option value="Staff">Trek Staff</option>
          </select>
        </div>
        <div class="mt-3">
<button type="submit" class="btn btn-primary">Register</button>
Already have an account?
<a href="{{url_for('login')}}">Login</a>
</div>
</form>
{%endblock%}
