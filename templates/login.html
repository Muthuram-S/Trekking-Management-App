{%extends "index.html"%}
{%block content%}
<form method="POST"><div class="mb-3 align-center py-3">
    <h1 class="align-center">Login</h1>
    <br>
  <label for="exampleFormControlInput1" class="form-label">Email address</label>
  <input type="email" name="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com" required>

<label for="inputPassword5" class="form-label">Password</label>
<input type="password" id="inputPassword5" name="password" class="form-control" aria-describedby="passwordHelpBlock" required>
<div id="passwordHelpBlock" class="form-text" style="color: white;">
  Your password must be 6 characters long.
</div>
<br>

<button class="btn btn-primary" type="submit" style="display: inline;">Login</button>
Don't have an account?
<a href="{{url_for('register')}}">Register</a>
  </div>
</form>

{%endblock%}
