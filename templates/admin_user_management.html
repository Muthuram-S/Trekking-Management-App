<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>
        Display Trek
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg " style="background-color: #2F5233;">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-white" href="{{ url_for('admin') }}">TrekManager</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link " href="{{url_for('admin')}}">Dashboard</a>
                        <a class="nav-link" href="{{url_for('user_management')}}">Users</a>
                        <a class="nav-link" href="{{url_for('trek')}}">Treks</a>
                        <a class="nav-link" href="{{url_for('staff_management')}}">Staffs</a>
                        <a class="nav-link" href="{{url_for('bookings')}}">Bookings</a>
                        <a class="btn btn-warning " >Admin</a>
                        <a class="nav-link " href="{{ url_for('logout') }}">Logout</a>
                    </div>
                </div>
            </div>
        </nav>
        
    </div>
    <div>
       
    </div>
    <br>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-14">
            <h4 class="mt-3 mb-2"> <i class="bi bi-people-fill"></i> User Management</h4>
            <form method="GET" action="{{url_for('user_management')}}" class="d-flex mb-3">
            <input type="type" class="form-control" name="search" placeholder="search by  name or id" value="{{search or ''}}">
            <button type="submit" class="btn btn-outline-secondary">search</button>
        </form>
        <table class="table">
        <thead class="table-dark">
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Bookings</th>
            <th>Status</th>
           
        </thead>
        <tbody>
          
                {%for i in users%}
                <tr>
                    <td>{{i.Id}}</td>
                    <td>{{i.Username}}</td>
                    <td>{{i.Email}}</td>
                    <td>{{i.bookings_count}}
                    </td>
                    <td>{% if i.Status=="Approved"%}
                        <a href="{{url_for('user_blacklist',user_id=i.Id)}}" class="btn btn-danger btn-sm">Blacklist</a>
                        {%else%}
                        <a href="{{url_for('user_approve',user_id=i.Id)}}"class="btn btn-success btn-sm">Approve</a>
                        {%endif%}
                    </td>
                   </tr>
            {%endfor%}
        </tbody>
        </table>
    </div>
</div>
</div>



</body>
</html>
