<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        My Trek
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
     <div>
    <nav class="navbar navbar-expand-lg " style="background-color: #2F5233;">
    <div class="container-fluid">
        
            <a class="navbar-brand fw-bold text-white" href="{{ url_for('staff_dashboard') }}">TrekManager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav ms-auto">
                <a class="nav-link " href="{{url_for('staff_dashboard')}}">Dashboard</a>
                <a class="nav-link" href="{{url_for('my_trek')}}">My Treks</a>
                <a class="nav-link" href="{{url_for('staff_profile')}}">Profile</a>
                <a class="btn btn-warning " >Staff</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
        </div>
        </div>
    </div>
    </nav>
        
        </div>
    
    <div class="container mt-4">
        <h4 class="mt-4 mb-4"><i class="bi bi-map"></i> My Treks</h4>
        <div class="row ">
            {%for t in trek %}
            <div class="col-md-6 mb-4">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h5 class="card-title d-flex">{{ t.Trek_Name }} <span class="justify-content-end">---{{t.Difficulty}}</span>  </h5>
                        

                        <p class="text-muted mb-2"><i class="bi bi-geo-alt me-1"></i>{{ t.Location }}</p>
                        <p class="text-muted mb-2"><i class="bi bi-calendar me-1"></i>{{ t.Start_Date }} → {{ t.End_Date
                            }}</p>
                        <p class="text-muted mb-2"><i class="bi bi-clock"></i> {{ t.Duration }} <i
                                class="bi bi-people"></i>  {{ t.Available_Slots }}/{{ t.Total_Slots }}</p>
                        <!--<span class="badge badge-{{ t.Status.lower() }} mb-3">{{ t.Status }}</span>
                        !-->
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('update_trek', trek_id=t.Trek_Id) }}" class="btn btn-primary btn-sm"><i
                                    class="bi bi-pencil me-1"></i>Update</a>
                            <a href="{{ url_for('participants', trek_id=t.Trek_Id) }}"
                                class="btn btn-outline-secondary btn-sm"><i
                                    class="bi bi-people me-1"></i>Participants</a>
                        </div>
                       
                   
                </div>
            </div>
        </div>
        {%else%}
            <p div class="text-center mt-4">No Treks Assigned</p>
               
         {%endfor%}
</div>
</body>

</html>
